name: Playback / provider issue
description: A specific stream, channel, EPG entry, or VOD title isn't working.
title: "[Playback] "
labels: ["playback"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when something inside your playlist isn't working: a channel won't play, EPG is missing, VOD info is wrong, etc.

        **Important:** the app is just a player. It can't fix problems on the provider's side. Many "doesn't work" reports turn out to be provider-side issues. Please check whether the same stream works in VLC or another player before filing - and include that result below.
  - type: dropdown
    id: surface
    attributes:
      label: Where does it fail?
      options:
        - Live TV (channel won't play)
        - Live TV (EPG empty / wrong / mistimed)
        - Movies / VOD (won't play)
        - Movies / VOD (metadata wrong)
        - Series (seasons / episodes wrong)
        - Series (episode won't play)
        - Full EPG schedule grid
        - Downloads
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happens
    attributes:
      label: What happens?
      description: Describe what you see. Include any on-screen error message verbatim.
      placeholder: |
        I click channel "BBC One" and the player shows "Loading..." for ~10 seconds, then the empty state returns.
    validations:
      required: true
  - type: dropdown
    id: playlist-type
    attributes:
      label: Playlist type
      options:
        - Xtream Codes
        - Plain M3U / M3U8 URL
    validations:
      required: true
  - type: dropdown
    id: vlc-test
    attributes:
      label: Does the same stream work in VLC (or another player)?
      description: |
        For Xtream channels: try `http(s)://<host>:<port>/live/<user>/<pass>/<stream_id>.m3u8` directly in VLC.
        For M3U entries: copy the channel's URL from your playlist into VLC.
        This single check eliminates ~half of "won't play" reports as upstream issues.
      options:
        - "Yes, it works in VLC"
        - "No, it also fails in VLC"
        - "I haven't tested"
    validations:
      required: true
  - type: input
    id: stream-format
    attributes:
      label: Stream format (if known)
      description: |
        HLS (.m3u8), MPEG-TS, MP4, etc. The app can tell you: right-click (or long-press) the channel in Live TV and pick **Test stream**, which reports the content type. During playback, `Ctrl+Shift+S` shows the playback stats overlay, including which engine is handling the stream. Your provider's interface may also list it.
      placeholder: e.g. HLS / .m3u8
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Windows desktop
        - Android phone / tablet
        - Android TV
        - Linux desktop
        - macOS desktop
        - Web build
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: e.g. 1.1.0
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics file
      description: |
        1. In the app, go to **Settings -> Playlists**, expand the playlist that's failing, and press **Run full diagnostic**. It checks your login, the channel/movie/series lists, your guide (EPG), a sample stream and the update service.
        2. Then go to **Settings -> Help and feedback -> Export diagnostics** and drag the saved `.zip` into this box. Running the diagnostic first means its results are included in the file.

        Usernames, passwords and tokens are stripped out before the file is written. Server names can still appear, so have a look through it before attaching.
      placeholder: Drag the exported .zip in here.
  - type: textarea
    id: console-errors
    attributes:
      label: Log file
      description: |
        Only needed if you couldn't export the diagnostics file above. The app writes a log file per day and already strips credentials and stream paths out of it as it writes.

        - **Desktop:** Settings -> Storage -> **Open log folder**, then attach the newest `app-YYYY-MM-DD.log`, or paste the last part of it below.
        - **Android:** Settings -> Storage -> **Share logs**.

        Server names can still appear in it, so have a look before attaching.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I redacted my credentials and full stream URL from any pasted output.
          required: true
        - label: I tried the same stream in VLC (or noted that I haven't).
          required: true
