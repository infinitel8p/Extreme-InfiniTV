name: Snap Build Test

# Dry run: builds the snap from a past stable release's amd64 .deb and uploads
# the .snap as a workflow artifact. Never publishes. Use this to prove
# packaging/snap/snapcraft.yaml still builds before cutting the next stable tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build from (defaults to the latest published stable release)"
        required: false
        type: string
  pull_request:
    paths:
      - "packaging/snap/**"
      - ".github/workflows/snap-test.yml"

jobs:
  build-snap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh release list --repo "${{ github.repository }}" \
              --exclude-drafts --exclude-pre-releases --limit 1 \
              --json tagName --jq '.[0].tagName')
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No published stable release found and no tag input given"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download amd64 deb from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p packaging/snap/local
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "*amd64.deb" \
            --output packaging/snap/local/app.deb

      - name: Set snap version
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          sed -i "s/__VERSION__/$VERSION/" packaging/snap/snapcraft.yaml

      - name: Build snap
        id: build
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        with:
          path: packaging/snap

      - name: Upload snap artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extreme-infinitv-snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
