            --enable-muxer=mpegts \
            --enable-decoder=aac \
            --enable-decoder=aac_latm \
            --enable-decoder=ac3 \
            --enable-decoder=eac3 \
            --enable-decoder=mp2 \
            --enable-decoder=mp3 \
            --enable-decoder=dca \
            --enable-decoder=opus \
            --enable-decoder=vorbis \
            --enable-decoder=flac \
            --enable-decoder=truehd \
            --enable-decoder=pcm_s16le \
            --enable-decoder=h264 \
            --enable-decoder=hevc \
            --enable-encoder=aac \
            --enable-parser=h264 \
            --enable-parser=hevc \
            --enable-parser=mpegvideo \
            --enable-parser=mpegaudio \
            --enable-parser=aac \
            --enable-parser=aac_latm \
            --enable-parser=ac3 \
            --enable-parser=dca \
            --enable-filter=aresample \
            --enable-filter=aformat \
            --enable-filter=anull \
            --enable-bsf=extract_extradata \
            --enable-bsf=h264_mp4toannexb \
            --enable-bsf=hevc_mp4toannexb \
            --enable-bsf=aac_adtstoasc \
            --enable-zlib
          make -j$(sysctl -n hw.ncpu)

      - name: Sanity checks (arm64)
        shell: bash
        run: |
          set -euo pipefail
          cd ffmpeg-src
          ./ffmpeg -version
          if ./ffmpeg -version | grep -q -- '--enable-gpl'; then
            echo "::error::Build unexpectedly enabled GPL"
            exit 1
          fi
          if ./ffmpeg -version | grep -q -- '--enable-nonfree'; then
            echo "::error::Build unexpectedly enabled nonfree"
            exit 1
          fi
          ./ffmpeg -decoders | grep -i eac3
          ./ffmpeg -decoders | grep -w h264
          ./ffmpeg -decoders | grep -w hevc
          ./ffmpeg -encoders | grep -w aac
          ls -lh ffmpeg

      - name: Stage arm64 artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          cp ffmpeg-src/ffmpeg stage/ffmpeg-aarch64-apple-darwin
          cd ffmpeg-src
          make distclean

      # Same source tree, cross-compiled via clang's -arch flag (no separate toolchain needed)
      - name: Configure and build (x86_64 cross, LGPL, trimmed)
        shell: bash
        run: |
          set -euo pipefail
          cd ffmpeg-src
          ./configure \
            --disable-everything --disable-autodetect --enable-network \
            --disable-doc --disable-debug --disable-ffplay --disable-ffprobe \
            --disable-avdevice --disable-postproc \
            --enable-protocol=pipe,http,tcp \
            --enable-demuxer=mpegts,matroska,mov \
            --enable-muxer=mpegts \
            --enable-decoder=aac \
            --enable-decoder=aac_latm \
            --enable-decoder=ac3 \
            --enable-decoder=eac3 \
            --enable-decoder=mp2 \
            --enable-decoder=mp3 \
            --enable-decoder=dca \
            --enable-decoder=opus \
            --enable-decoder=vorbis \
            --enable-decoder=flac \
            --enable-decoder=truehd \
            --enable-decoder=pcm_s16le \
            --enable-decoder=h264 \
            --enable-decoder=hevc \
            --enable-encoder=aac \
            --enable-parser=h264 \
            --enable-parser=hevc \
            --enable-parser=mpegvideo \
            --enable-parser=mpegaudio \
            --enable-parser=aac \
            --enable-parser=aac_latm \
            --enable-parser=ac3 \
            --enable-parser=dca \
            --enable-filter=aresample \
            --enable-filter=aformat \
            --enable-filter=anull \
            --enable-bsf=extract_extradata \
            --enable-bsf=h264_mp4toannexb \
            --enable-bsf=hevc_mp4toannexb \
            --enable-bsf=aac_adtstoasc \
            --enable-zlib \
            --enable-cross-compile --arch=x86_64 --target-os=darwin --cc="clang -arch x86_64"
          make -j$(sysctl -n hw.ncpu)

      # Runner is arm64 and Rosetta isn't guaranteed, so verify the slice without running it
      - name: Verify x86_64 slice
        shell: bash
        run: |
          set -euo pipefail
          cd ffmpeg-src
          lipo -archs ffmpeg | grep -w x86_64
          file ffmpeg | grep -i x86_64
          cd ..
          mkdir -p stage
          cp ffmpeg-src/ffmpeg stage/ffmpeg-x86_64-apple-darwin

      - name: Create universal binary and stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          lipo -create stage/ffmpeg-aarch64-apple-darwin stage/ffmpeg-x86_64-apple-darwin -output stage/ffmpeg-universal-apple-darwin
          chmod +x stage/ffmpeg-aarch64-apple-darwin stage/ffmpeg-x86_64-apple-darwin stage/ffmpeg-universal-apple-darwin
          stage/ffmpeg-aarch64-apple-darwin -version
          stage/ffmpeg-universal-apple-darwin -version
          cp ffmpeg-src/COPYING.LGPLv2.1 stage/
          {
            echo "ffmpeg version: ${FFMPEG_VERSION}"
            echo "source: https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
            echo "source sha256: ${FFMPEG_SHA256}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow commit: ${GITHUB_SHA}"
            echo
            echo "assets: ffmpeg-aarch64-apple-darwin, ffmpeg-x86_64-apple-darwin (cross-compiled, not executed on this runner), ffmpeg-universal-apple-darwin (lipo of the two)"
            echo
            echo "arm64 configure line:"
            echo "./configure --disable-everything --disable-autodetect --enable-network --disable-doc --disable-debug --disable-ffplay --disable-ffprobe --disable-avdevice --disable-postproc --enable-protocol=pipe,http,tcp --enable-demuxer=mpegts,matroska,mov --enable-muxer=mpegts --enable-decoder=aac --enable-decoder=aac_latm --enable-decoder=ac3 --enable-decoder=eac3 --enable-decoder=mp2 --enable-decoder=mp3 --enable-decoder=dca --enable-decoder=opus --enable-decoder=vorbis --enable-decoder=flac --enable-decoder=truehd --enable-decoder=pcm_s16le --enable-decoder=h264 --enable-decoder=hevc --enable-encoder=aac --enable-parser=h264 --enable-parser=hevc --enable-parser=mpegvideo --enable-parser=mpegaudio --enable-parser=aac --enable-parser=aac_latm --enable-parser=ac3 --enable-parser=dca --enable-filter=aresample --enable-filter=aformat --enable-filter=anull --enable-bsf=extract_extradata --enable-bsf=h264_mp4toannexb --enable-bsf=hevc_mp4toannexb --enable-bsf=aac_adtstoasc --enable-zlib"
            echo
            echo "x86_64 configure line:"
            echo "./configure --disable-everything --disable-autodetect --enable-network --disable-doc --disable-debug --disable-ffplay --disable-ffprobe --disable-avdevice --disable-postproc --enable-protocol=pipe,http,tcp --enable-demuxer=mpegts,matroska,mov --enable-muxer=mpegts --enable-decoder=aac --enable-decoder=aac_latm --enable-decoder=ac3 --enable-decoder=eac3 --enable-decoder=mp2 --enable-decoder=mp3 --enable-decoder=dca --enable-decoder=opus --enable-decoder=vorbis --enable-decoder=flac --enable-decoder=truehd --enable-decoder=pcm_s16le --enable-decoder=h264 --enable-decoder=hevc --enable-encoder=aac --enable-parser=h264 --enable-parser=hevc --enable-parser=mpegvideo --enable-parser=mpegaudio --enable-parser=aac --enable-parser=aac_latm --enable-parser=ac3 --enable-parser=dca --enable-filter=aresample --enable-filter=aformat --enable-filter=anull --enable-bsf=extract_extradata --enable-bsf=h264_mp4toannexb --enable-bsf=hevc_mp4toannexb --enable-bsf=aac_adtstoasc --enable-zlib --enable-cross-compile --arch=x86_64 --target-os=darwin --cc=\"clang -arch x86_64\""
          } > stage/BUILD-INFO-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos
          path: stage/*

  publish:
    needs: [build-windows, build-linux, build-windows-arm64, build-linux-arm64, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp artifacts/ffmpeg-windows/* release-assets/
          cp artifacts/ffmpeg-linux/* release-assets/
          cp artifacts/ffmpeg-windows-arm64/* release-assets/
          cp artifacts/ffmpeg-linux-arm64/* release-assets/
          cp artifacts/ffmpeg-macos/* release-assets/
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          ls -la

      # The app and pipelines verify against the committed pins; SHA256SUMS.txt is informational.
      - name: Surface checksums for the committed pins
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### ffmpeg sidecar checksums"
            echo
            echo "Pin these in \`src/scripts/ffmpeg-sidecar-checksums.json\` (\`node src/scripts/ensure-ffmpeg-sidecar.mjs --update-pins\`, then review and commit) or release.yml and beta.yml will reject the new binaries."
            echo
            echo '```'
            cat release-assets/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat release-assets/SHA256SUMS.txt

      - name: Create or update rolling prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="ffmpeg-sidecar-v2"
          BODY_FILE="$RUNNER_TEMP/body.md"
          {
            echo "Trimmed, LGPL-only ffmpeg sidecar binaries consumed by the desktop release and beta build pipelines (see ffmpeg.md, \"Binary strategy\")."
            echo
            echo "This is a rolling prerelease: pushing a new build to the \"ffmpeg Sidecar\" workflow replaces the assets in place, it does not create a new tag."
            echo
            echo "Configure line:"
            echo '```'
            echo "./configure --disable-everything --disable-autodetect --enable-network --disable-doc --disable-debug --disable-ffplay --disable-ffprobe --disable-avdevice --disable-postproc --enable-protocol=pipe,http,tcp --enable-demuxer=mpegts,matroska,mov --enable-muxer=mpegts --enable-decoder=aac,aac_latm,ac3,eac3,mp2,mp3,dca,opus,vorbis,flac,truehd,pcm_s16le,h264,hevc --enable-encoder=aac --enable-parser=h264,hevc,mpegvideo,mpegaudio,aac,aac_latm,ac3,dca --enable-filter=aresample,aformat,anull --enable-bsf=extract_extradata,h264_mp4toannexb,hevc_mp4toannexb,aac_adtstoasc --enable-zlib"
            echo '```'
            echo "(each comma-separated group above is repeated once per value in the actual build - see BUILD-INFO-windows.txt / BUILD-INFO-windows-arm64.txt / BUILD-INFO-linux.txt / BUILD-INFO-linux-arm64.txt / BUILD-INFO-macos.txt attached below for the exact per-platform command.)"
            echo
            echo "Source for this exact build: the official ffmpeg ${FFMPEG_VERSION} release tarball, https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz (sha256 ${FFMPEG_SHA256}). This note is the LGPL source offer for the binaries attached to this release."
          } > "$BODY_FILE"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --prerelease --notes-file "$BODY_FILE"
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --prerelease --title "ffmpeg sidecar v2" --notes-file "$BODY_FILE"
          fi

          gh release upload "$TAG" release-assets/* --repo "${{ github.repository }}" --clobber
