name: Flatpak test build

# Builds the Flathub submission manifest to catch breakage before it reaches
# review. Not the actual Flathub build (that runs on Flathub's own infra
# once the submission PR is merged) - this is a local sanity check.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/flatpak/**"

permissions:
  contents: read

jobs:
  flatpak:
    name: Build manifest
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v5

      - uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        with:
          bundle: extreme-infinitv.flatpak
          manifest-path: packaging/flatpak/io.github.infinitel8p.Extreme-InfiniTV.yml
          cache-key: flatpak-builder-${{ github.sha }}

      # The build leaves the OSTree repo behind so the lint job's repo check can use it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-repo
          path: repo
          retention-days: 1

  lint:
    name: Lint manifest and repo
    needs: flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub/flatpak-builder-lint:latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint manifest
        run: flatpak-builder-lint manifest packaging/flatpak/io.github.infinitel8p.Extreme-InfiniTV.yml

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-repo
          path: repo

      - name: Lint repo
        run: flatpak-builder-lint repo repo
