name: Release

# Triggers:
#  - push a tag like `v0.4.1`           -> full release build for that tag
#      git tag v0.4.1 && git push origin v0.4.1
#  - run "Release" from the Actions tab -> uses the version in package.json
#      as the tag (e.g. v0.4.1) and creates it from the chosen branch's HEAD
#
# The release body is auto-generated from commits + merged PRs since the
# previous tag (GitHub's "generate release notes" API), so you do NOT need
# to use annotated tags or PRs for everything.
#
# Required repo secrets / variables (Settings -> Secrets and variables -> Actions):
#  TAURI_SIGNING_PRIVATE_KEY            RAW contents of ~/.tauri/<your-key>.key
#                                       (the file is already base64-encoded by
#                                       `tauri signer generate` -- do NOT base64 it again,
#                                       or you get "Missing encoded key in secret key").
#                                       On macOS: `pbcopy < ~/.tauri/<your-key>.key`
#  TAURI_SIGNING_PRIVATE_KEY_PASSWORD   the passphrase set during keygen (empty if none)
#  ANDROID_KEYSTORE_BASE64              base64 of upload-keystore.jks
#                                       On macOS: `base64 -i upload-keystore.jks | pbcopy`
#  ANDROID_KEYSTORE_PASSWORD            store password
#  ANDROID_KEY_ALIAS                    e.g. "upload"
#  ANDROID_KEY_PASSWORD                 key password (often same as store)
#  PLAY_SERVICE_ACCOUNT_JSON            Google Cloud service account JSON linked
#                                       in Play Console with release permission
#                                       (optional; Play publishing is skipped
#                                       when unset)
#  MSSTORE_TENANT_ID                    Microsoft Entra tenant Id for the Partner
#                                       Center account (Store publishing is
#                                       skipped when MSSTORE_CLIENT_SECRET is unset)
#  MSSTORE_SELLER_ID                    Partner Center seller Id
#  MSSTORE_CLIENT_ID                    App registration (client) Id used for
#                                       Store API access
#  MSSTORE_CLIENT_SECRET                App registration client secret
#  SNAPCRAFT_STORE_CREDENTIALS          output of `snapcraft export-login` for the
#                                       extreme-infinitv Snap Store listing, scoped to
#                                       package_push/package_release; snap publishing
#                                       is skipped when unset
#
# Outputs (attached to the GitHub Release):
#  Windows      *-setup.exe + .sig (NSIS; x64 + arm64, arm64 is NSIS-only since
#               WiX can't build arm64 MSIs), latest.json (auto-generated by tauri-action)
#  macOS        *.dmg, *.app.tar.gz + .sig (universal binary)
#  Linux        *.AppImage + .sig, *.deb (x64 + arm64)
#  Android      *.apk, signed (the dedicated Android TV AAB build exists in
#               this workflow but is currently disabled). The phone/tablet AAB
#               is delivered to Google Play via the play-aab workflow artifact
#               instead of the release page; download it there manually as a
#               fallback (subject to the default artifact retention window)
#
# MSIX / Microsoft Store: the Windows x64 leg of build-tauri stages the built
# exe + ffmpeg sidecar + logo assets and packs an unsigned .msix with the
# Windows SDK tools (`pnpm msix:ci`, see buildfiles/make-msix-ci.mjs), uploaded
# as the msix-package artifact. The Store re-signs on ingestion. publish-msstore
# submits that package to the existing Store listing (product Id 9NN162Z0WXSR)
# when the MSSTORE_* secrets are set. `pnpm msix` (buildfiles/make-msix-template.mjs)
# remains the manual fallback - see `cmds.md`.
#
# Snap Store: publish-snap repackages the Linux .debs (x64 + arm64) from
# build-tauri via `packaging/snap/snapcraft.yaml` and releases them to the
# stable channel when SNAPCRAFT_STORE_CREDENTIALS is set. See
# `.github/workflows/snap-test.yml` to dry-run the build without publishing.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Find the most recent tag that isn't the one we're creating, so we
          # can summarise commits since then. Empty if this is the first tag.
          PREV=$(git tag --sort=-creatordate \
            | grep -v "^${TAG}$" \
            | head -n1 || true)
          echo "prev_tag=$PREV" >> "$GITHUB_OUTPUT"

      - id: gather
        shell: bash
        env:
          PREV_TAG: ${{ steps.meta.outputs.prev_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            HEADER="Commits since ${PREV_TAG}"
            PREV_DATE=$(git log -1 --format=%cI "$PREV_TAG" || echo "")
          else
            RANGE=""
            HEADER="All commits (no previous tag)"
            PREV_DATE=""
          fi
          # Order matters: with the 24 KB trim below, content earlier in this
          # block is more likely to survive truncation. Order from highest to
          # lowest signal:
          #   1. Compact commit subjects (always fits, gives the model an index)
          #   2. Merged PR descriptions (canonical "what shipped" for release
          #      branches - usually the most valuable single source)
          #   3. Commit details with bodies (richer fallback)
          #   4. File change summary (noise; lowest priority)
          {
            echo "## $HEADER"
            echo
            echo "### Commit subjects"
            echo
            git log --no-merges --pretty=format:'- %s (%h) by %an' $RANGE
            echo
            echo
            if [ -n "$PREV_DATE" ]; then
              echo "### Merged PR descriptions"
              echo
              gh pr list \
                --state merged \
                --base main \
                --limit 50 \
                --search "merged:>$PREV_DATE" \
                --json number,title,body,mergedAt \
                --jq '.[] | "#### #\(.number): \(.title)\n\nMerged: \(.mergedAt)\n\n\(.body)\n\n---\n"' \
                || echo "(no merged PRs found)"
              echo
            fi
            echo "### Commit details (subject + body)"
            echo
            git log --no-merges --pretty=format:'#### %s (%h)%n%n%b%n---%n' $RANGE
            echo
            echo "### File change summary"
            echo
            git diff --stat $RANGE | tail -n 200
          } > "$RUNNER_TEMP/changes.md"
          # cap so a huge release range can't blow the model's context window
          head -c 400000 "$RUNNER_TEMP/changes.md" > "$RUNNER_TEMP/changes.trimmed.md"
          {
            echo 'log<<CHANGES_EOF'
            cat "$RUNNER_TEMP/changes.trimmed.md"
            echo
            echo 'CHANGES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - id: ai
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          model: claude-sonnet-4.5
          max-tokens: 4000
          system-prompt: |
            You write user-facing release notes for "Extreme InfiniTV", an IPTV
            player built with Astro + Svelte 5 and Tauri 2. It ships on
            Windows desktop (NSIS + Microsoft Store), Android phone / tablet /
            TV (Google Play + APK), macOS, Linux, and the web. Audience: end
            users, not contributors.

            You are given three sources of truth, in priority order:
              1. Merged PR descriptions - the most reliable "what shipped".
                 When present, treat them as the primary source.
              2. Commit details (subject + body) - bodies often list multiple
                 user-visible features under one subject.
              3. Commit subjects - the weakest source; use only for filling in
                 minor changes the PR descriptions don't cover.

            Output structure (in this exact order):

            1. A single bold sentence summarising the headline change of the
               release, written as one line of markdown wrapped in `**...**`.
               It should answer "what's the most useful thing in this release
               for a user". No preamble like "In this release". Skip this line
               only if no commit is user-facing.
               CRITICAL: this bold line MUST be the very first line of your
               output. Do NOT precede it with any heading like
               "## Release Notes" or "## Changelog vX.Y.Z" - the body template
               adds its own changelog heading downstream, and the in-app
               updater dialog extracts this bold line as the release summary
               by reading the first line of your output.
            2. If the release contains a breaking change, rename, or anything
               existing users need to know about *before* updating, add a
               `## Heads up` section directly after the summary explaining what
               changes for them. Skip this section if there is no breaking change.
            3. A blank line.
            4. Section headings, each on its own line, in this exact order,
               omitting any whose bullet list would be empty:
                 ### New
                 ### Improved
                 ### Fixed
                 ### Under the hood
               Each heading is followed by one or more bullets.

            Rules:
            - Output GitHub-flavoured markdown only. No preamble before the
              summary, no closing remarks after the last bullet.
            - A single commit or PR can produce multiple bullets when it
              touches multiple user-visible features. Don't compress unrelated
              features into one bullet just because they share a commit.
            - Be concrete and specific. Prefer "Picture-in-Picture and a
              subtitle / audio-track picker in the movies and series player"
              over "Improved player UI". Name the feature, not the abstraction.
            - Drop conventional-commit prefixes (feat:, fix:, chore:, etc.)
              when rewriting subjects into bullets.
            - Sort bullets within each section by user impact, biggest first.
            - Merge duplicates. Collapse multiple dependency bumps into a
              single "Updated dependencies" bullet under "Under the hood",
              but only include it when commits actually exist for it - never
              invent a dependency-bump bullet to fill space.
            - Skip purely internal noise (lockfile-only changes, CI tweaks,
              comment edits, tracking-file removals, screenshot updates,
              README rewrites that don't change behaviour) unless they affect
              users.
            - Do not invent features. If the sources do not justify a heading
              or a bullet, omit it.
            - Don't write meta-bullets like "Various improvements" or
              "Several bug fixes". Be specific or omit.
            - No emojis anywhere - not in the summary, not in headings, not in
              bullets. Plain text only.
            - Never use em dashes. Use a regular hyphen, a colon, parentheses,
              or rewrite the sentence.
          prompt: |
            Write release notes for tag ${{ steps.meta.outputs.tag }}.

            ${{ steps.gather.outputs.log }}
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}

      - id: create
        uses: actions/github-script@v8
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          AI_NOTES: ${{ steps.ai.outputs.response }}
        with:
          script: |
            const tag = process.env.TAG
            const version = process.env.VERSION

            // Re-runs of this workflow on the same tag should reuse the
            // existing draft (preserving any manual body edits) instead of
            // piling up duplicate drafts. Look up by tag name across drafts
            // and published releases.
            try {
              const releases = await github.paginate(
                github.rest.repos.listReleases,
                { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
              )
              const existing = releases.find(release => release.tag_name === tag)
              if (existing) {
                core.info(`Reusing existing release id=${existing.id} for tag ${tag}; body left intact.`)
                return existing.id
              }
            } catch (e) {
              core.warning(`listReleases failed, will attempt createRelease: ${e.message}`)
            }

            let changelog = (process.env.AI_NOTES || '').trim()

            if (!changelog) {
              try {
                const notes = await github.rest.repos.generateReleaseNotes({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  target_commitish: context.sha,
                })
                changelog = (notes.data.body || '').trim()
              } catch (e) {
                core.warning(`generateReleaseNotes failed: ${e.message}`)
              }
            }
            if (!changelog) {
              changelog = '_No changes detected. Edit this draft before publishing._'
            }

            // Find the headline summary: the first standalone **bold** line.
            // The model occasionally emits a leading "## Release Notes for vX"
            // header or blank lines before the summary, so tolerate up to a few
            // ATX headings / empty lines and pick the first bold-only line.
            let summary = ''
            const lines = changelog.split('\n')
            let summaryMatch = null
            let summaryEndIdx = 0
            for (let scanIdx = 0; scanIdx < Math.min(lines.length, 6); scanIdx++) {
              const text = lines[scanIdx].trim()
              if (!text) continue
              const match = text.match(/^\*\*(.+)\*\*\s*$/)
              if (match) {
                summaryMatch = match
                summaryEndIdx = scanIdx + 1
                break
              }
              if (!/^#{1,6}\s/.test(text)) break
            }
            if (summaryMatch) {
              summary = `<strong>${summaryMatch[1]}</strong>`
              let scanIdx = summaryEndIdx
              while (scanIdx < lines.length && lines[scanIdx].trim() === '') scanIdx++
              changelog = lines.slice(scanIdx).join('\n').trim()
            }

            // GitHub asset URLs replace spaces in the original filename with
            // dots when serving the file. Wrap each row's filename in a
            // markdown link so users can click through directly without
            // scrolling to the Assets section at the bottom.
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`
            const fileLink = (filename) => {
              const slug = filename.replace(/ /g, '.')
              return `[\`${filename}\`](${repoUrl}/releases/download/${tag}/${slug})`
            }
            const downloads = [
              '## Downloads',
              '',
              'The Microsoft Store, Google Play and Snap Store are the easiest path on Windows, Android and Linux. For direct downloads, expand the table and pick the file that matches your device.',
              '',
              '<details><summary><strong>All downloads</strong> (Windows, Windows on ARM, macOS, Linux x64/ARM64, Android)</summary>',
              '',
              '| Platform | File |',
              '|----------|------|',
              `| Windows 10/11 (recommended installer) | ${fileLink(`Extreme InfiniTV_${version}_x64-setup.exe`)} |`,
              `| Windows on ARM (Snapdragon laptops) | ${fileLink(`Extreme InfiniTV_${version}_arm64-setup.exe`)} |`,
              `| Windows (MSI alternative) | ${fileLink(`Extreme InfiniTV_${version}_x64_en-US.msi`)} |`,
              `| macOS (Apple Silicon + Intel) | ${fileLink(`Extreme InfiniTV_${version}_universal.dmg`)} |`,
              `| Linux Snap (most distros) | [Snap Store](https://snapcraft.io/extreme-infinitv) or \`sudo snap install extreme-infinitv\` |`,
              `| Linux Debian / Ubuntu / Mint | ${fileLink(`Extreme InfiniTV_${version}_amd64.deb`)} |`,
              `| Linux ARM64 - Raspberry Pi 4/5 (64-bit OS), Debian / Ubuntu | ${fileLink(`Extreme InfiniTV_${version}_arm64.deb`)} |`,
              `| Linux Fedora / openSUSE / RHEL | ${fileLink(`Extreme InfiniTV-${version}-1.x86_64.rpm`)} |`,
              `| Linux Fedora / openSUSE / RHEL (ARM64) | ${fileLink(`Extreme InfiniTV-${version}-1.aarch64.rpm`)} |`,
              `| Linux portable (any distro) | ${fileLink(`Extreme InfiniTV_${version}_amd64.AppImage`)} |`,
              `| Linux portable (ARM64, any distro) | ${fileLink(`Extreme InfiniTV_${version}_aarch64.AppImage`)} |`,
              `| Android sideload (APK) | ${fileLink(`Extreme InfiniTV_${version}.apk`)} |`,
              '',
              '<details><summary>What about the <code>.sig</code> files, <code>latest.json</code> and the macOS <code>.app.tar.gz</code>?</summary>',
              '',
              'You can ignore them.',
              '',
              '- `*.sig` and `latest.json` are used by the built-in auto-updater to verify each download is genuinely signed. The app downloads them on its own when checking for updates.',
              '- `Extreme InfiniTV_universal.app.tar.gz` is the macOS update bundle consumed by the same updater. For a fresh install on macOS, use the `.dmg` instead.',
              '',
              '</details>',
              '',
              '<details><summary>macOS: "Extreme InfiniTV.app" cannot be opened / "Apple could not verify..."</summary>',
              '',
              'The macOS build is not yet notarized by Apple, so Gatekeeper blocks it on first launch. After dragging the app from the `.dmg` into `/Applications`, remove the quarantine flag from a Terminal:',
              '',
              '```bash',
              'xattr -dr com.apple.quarantine "/Applications/Extreme InfiniTV.app"',
              '```',
              '',
              'Then open the app normally. You only need to do this once per install.',
              '',
              '</details>',
              '',
              '</details>',
              '',
              '<a href="https://play.google.com/store/apps/details?id=com.infinitel8p.xtream">',
              '<img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" height="60"/>',
              '</a>',
              '',
              '[![Get it from Microsoft](https://get.microsoft.com/images/en-us%20dark.svg)](https://apps.microsoft.com/store/detail/9NN162Z0WXSR)',
              '',
              '<a href="https://snapcraft.io/extreme-infinitv">',
              '<img alt="Get it from the Snap Store" src="https://snapcraft.io/en/dark/install.svg" height="60"/>',
              '</a>',
            ].join('\n')

            // Downloads go above the changelog so they stay visible before
            // GitHub's "read more" fold on long release notes.
            const body = [
              '<p align="center">',
              '  <img src="https://raw.githubusercontent.com/infinitel8p/Extreme-InfiniTV/refs/heads/main/src-tauri/icons/logos/readme-lockup-2x.png" alt="Extreme InfiniTV logo" width="400"/>',
              '</p>',
              '',
              ...(summary ? [`<p align="center">${summary}</p>`, ''] : []),
              downloads,
              '',
              `## Changelog ${tag}`,
              changelog,
            ].join('\n')

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Extreme InfiniTV ${tag}`,
              body,
              draft: true,
              prerelease: tag.includes("-"),
              target_commitish: context.sha,
            })
            return data.id
          result-encoding: string

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            rust-targets: ""
            sidecar-asset: ffmpeg-x86_64-pc-windows-msvc.exe
          - os: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin x86_64-apple-darwin"
            sidecar-asset: ffmpeg-universal-apple-darwin
          - os: ubuntu-22.04
            args: ""
            rust-targets: ""
            sidecar-asset: ffmpeg-x86_64-unknown-linux-gnu
          - os: windows-11-arm
            args: "--bundles nsis"
            rust-targets: ""
            sidecar-asset: ffmpeg-aarch64-pc-windows-msvc.exe
          - os: ubuntu-22.04-arm
            args: ""
            rust-targets: ""
            sidecar-asset: ffmpeg-aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-gl

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.os }}
          # Only save the cache from main builds, not tag-triggered release
          # builds. The post-step zstd save has been racy on Windows runners
          # (failing the job after a successful build) and tag pushes are
          # infrequent enough that they can ride on whatever cache main has
          # already produced.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: pnpm install --frozen-lockfile

      # ffmpeg sidecar binaries come from the "ffmpeg Sidecar" workflow's
      # rolling ffmpeg-sidecar-v2 prerelease, not built here.
      # Integrity comes from the committed pins, not the release's own sums.
      - name: Fetch ffmpeg sidecar
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          ASSET="${{ matrix.sidecar-asset }}"
          if ! gh release download ffmpeg-sidecar-v2 \
            --repo "${{ github.repository }}" \
            --pattern "$ASSET" \
            --dir src-tauri/binaries \
            --clobber; then
            echo "::error::Could not download $ASSET from the ffmpeg-sidecar-v2 release. Run the 'ffmpeg Sidecar' workflow first."
            exit 1
          fi
          if ! EXPECTED_SHA=$(node src/scripts/ensure-ffmpeg-sidecar.mjs --print-pin "$ASSET"); then
            echo "::error::$ASSET has no pinned sha256 in src/scripts/ffmpeg-sidecar-checksums.json. Run 'node src/scripts/ensure-ffmpeg-sidecar.mjs --update-pins' and commit the result."
            exit 1
          fi
          cd src-tauri/binaries
          echo "$EXPECTED_SHA  $ASSET" > asset.sha256
          # macOS runners have shasum, not sha256sum; both read the same "hash  file" format.
          if command -v sha256sum >/dev/null 2>&1; then
            CHECKSUM_CMD=(sha256sum -c asset.sha256)
          else
            CHECKSUM_CMD=(shasum -a 256 -c asset.sha256)
          fi
          if ! "${CHECKSUM_CMD[@]}"; then
            echo "::error::$ASSET does not match its pinned sha256 in src/scripts/ffmpeg-sidecar-checksums.json. Either the sidecar was republished (refresh the pins with --update-pins) or the asset was tampered with."
            exit 1
          fi
          rm -f asset.sha256
          cd - >/dev/null
          # Rename after verification: checksum pins are keyed by the release asset name.
          DEST="infinitv-$ASSET"
          mv "src-tauri/binaries/$ASSET" "src-tauri/binaries/$DEST"
          if [[ "${{ matrix.os }}" != windows-* ]]; then
            chmod +x "src-tauri/binaries/$DEST"
          fi

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true

      # Windows x64 only - MSIX is x64-only and the Store product targets that
      # architecture. Building always runs; submission needs Store secrets.
      - name: Package MSIX
        if: matrix.os == 'windows-latest'
        shell: bash
        run: pnpm msix:ci

      - name: Upload MSIX artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msix-package
          path: src-tauri/target/release/bundle/msix/*.msix
          if-no-files-found: error

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;29.0.13846066"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"
          key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: pnpm install --frozen-lockfile

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty"
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "XTREAM_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed AAB (mobile)
        env:
          XTREAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          XTREAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          XTREAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066
          XT_SKIP_FFMPEG_SIDECAR: "1"
        run: pnpm tauri android build --aab

      - name: Build signed APK (universal)
        env:
          XTREAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          XTREAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          XTREAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066
          XT_SKIP_FFMPEG_SIDECAR: "1"
        run: pnpm tauri android build --apk

      - name: Collect mobile artifacts
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/android-out"
          mkdir -p "$OUT"
          VERSION=$(node -p "require('./package.json').version")
          # Tauri drops AABs/APKs under build/outputs/{bundle,apk}/, picking
          # the newest match so a stale artifact can't be chosen.
          AAB=$(find src-tauri/gen/android/app/build/outputs/bundle -name "*release*.aab" -printf '%T@\t%p\n' | sort -rn | head -1 | cut -f2-)
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" -printf '%T@\t%p\n' | sort -rn | head -1 | cut -f2-)
          if [ -z "$AAB" ] || [ -z "$APK" ]; then
            echo "::error::Could not locate signed AAB/APK after build"
            find src-tauri/gen/android/app/build/outputs -type f
            exit 1
          fi
          cp "$AAB" "$OUT/Extreme InfiniTV_${VERSION}.aab"
          cp "$APK" "$OUT/Extreme InfiniTV_${VERSION}.apk"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      # The AAB never touches the release - Play publishing reads it from here.
      - name: Upload mobile AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: play-aab
          path: ${{ steps.collect.outputs.out }}/*.aab
          if-no-files-found: error

      # TV releases are paused - uncomment to re-enable the dedicated TV AAB.
      # - name: Build signed Android TV AAB
      #   env:
      #     XTREAM_TV_BUILD: "true"
      #     XTREAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      #     XTREAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      #     XTREAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      #     NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066
      #     XT_SKIP_FFMPEG_SIDECAR: "1"
      #   run: pnpm tauri android build --aab
      #
      # - name: Collect TV artifact
      #   shell: bash
      #   run: |
      #     set -euo pipefail
      #     OUT="${{ steps.collect.outputs.out }}"
      #     VERSION=$(node -p "require('./package.json').version")
      #     # Newest match = the TV AAB we just built (it overwrote the mobile one).
      #     TV_AAB=$(find src-tauri/gen/android/app/build/outputs/bundle -name "*release*.aab" -printf '%T@\t%p\n' | sort -rn | head -1 | cut -f2-)
      #     if [ -z "$TV_AAB" ]; then
      #       echo "::error::Could not locate signed Android TV AAB after build"
      #       find src-tauri/gen/android/app/build/outputs/bundle -type f
      #       exit 1
      #     fi
      #     cp "$TV_AAB" "$OUT/Extreme InfiniTV_${VERSION}_tv.aab"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(gh release view ${{ needs.create-release.outputs.release_id }} --json tagName -q .tagName 2>/dev/null \
            || gh api repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }} --jq .tag_name)
          gh release upload "$TAG" \
            "${{ steps.collect.outputs.out }}/"*.apk \
            --clobber

  # Publishes the phone/tablet AAB to Play production, reading it from the
  # play-aab workflow artifact - it never touches the GitHub release.
  publish-play:
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      HAS_PLAY_SECRET: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Download AAB artifact
        if: env.HAS_PLAY_SECRET == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: play-aab
          path: ${{ runner.temp }}/play

      - name: Locate AAB
        id: locate
        if: env.HAS_PLAY_SECRET == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ runner.temp }}/play"
          AAB=$(find "$OUT" -name "*.aab" -not -name "*_tv.aab")
          COUNT=$(printf '%s\n' "$AAB" | grep -c .)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one non-TV .aab in the play-aab artifact, found $COUNT"
            find "$OUT" -type f
            exit 1
          fi
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"

      - name: Publish AAB to Play production track
        if: env.HAS_PLAY_SECRET == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.infinitel8p.xtream
          releaseFiles: ${{ steps.locate.outputs.aab }}
          track: production
          status: completed

  # Submits the MSIX built in build-tauri to the existing Store listing.
  # The Store re-signs the package on ingestion, so the unsigned .msix works.
  publish-msstore:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.create-release.result == 'success' }}
    permissions:
      actions: read
    env:
      HAS_MSSTORE_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET != '' }}
    steps:
      - name: Download MSIX artifact
        if: env.HAS_MSSTORE_SECRET == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: msix-package
          path: msix

      - name: Setup Microsoft Store CLI
        if: env.HAS_MSSTORE_SECRET == 'true'
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      # msstore-cli stores credentials via libsecret, which needs a running
      # Secret Service (gnome-keyring on a D-Bus session bus) that headless
      # runners lack, so reconfigure and publish run inside one keyring session.
      - name: Publish to Microsoft Store
        if: env.HAS_MSSTORE_SECRET == 'true'
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libsecret-1-0 gnome-keyring dbus
          MSIX=$(find msix -name "*.msix")
          export MSIX
          dbus-run-session -- bash -euo pipefail -c '
            echo -n "ci-keyring" | gnome-keyring-daemon --unlock --components=secrets
            msstore reconfigure \
              --tenantId "$MSSTORE_TENANT_ID" \
              --sellerId "$MSSTORE_SELLER_ID" \
              --clientId "$MSSTORE_CLIENT_ID" \
              --clientSecret "$MSSTORE_CLIENT_SECRET"
            msstore publish "$MSIX" -id 9NN162Z0WXSR
          '

  # contents:write needed to download an asset off the still-draft release.
  publish-snap:
    needs: [create-release, build-tauri]
    if: ${{ !cancelled() && needs.create-release.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      HAS_SNAPCRAFT_SECRET: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
    steps:
      - name: Checkout
        if: env.HAS_SNAPCRAFT_SECRET == 'true'
        uses: actions/checkout@v5

      - name: Download deb from the release
        if: env.HAS_SNAPCRAFT_SECRET == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p packaging/snap/local
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "*${{ matrix.arch }}.deb" \
            --output packaging/snap/local/app.deb

      - name: Set snap version
        if: env.HAS_SNAPCRAFT_SECRET == 'true'
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/__VERSION__/$VERSION/" packaging/snap/snapcraft.yaml

      - name: Build snap
        if: env.HAS_SNAPCRAFT_SECRET == 'true'
        id: build
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        with:
          path: packaging/snap

      - name: Publish to the Snap Store
        if: env.HAS_SNAPCRAFT_SECRET == 'true'
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  # Patch the in-app auto-updater dialog text in `latest.json`. tauri-action
  # generates this file with `notes: ""` by default, so the in-app updater
  # prompt would otherwise show an empty changelog. The notes are derived
  # from the current release body (the first standalone **bold** line),
  # which means manual body edits are reflected on subsequent re-runs.
  patch-updater-notes:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Patch latest.json notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p _updater
          cd _updater
          if ! gh release download "$TAG" -p latest.json --repo "${{ github.repository }}"; then
            echo "::warning::latest.json missing on release $TAG - skipping notes patch"
            exit 0
          fi
          BODY=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq .body)
          BODY="$BODY" TAG="$TAG" node -e "
            const fs = require('fs');
            const body = process.env.BODY || '';
            let notes = '';
            for (const line of body.split(/\r?\n/)) {
              const trimmed = line.trim();
              const match = trimmed.match(/^\*\*(.+)\*\*$/);
              if (match) { notes = match[1].trim(); break; }
            }
            if (!notes) {
              notes = process.env.TAG + ' - see the GitHub release for details.';
            }
            const j = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
            j.notes = notes;
            fs.writeFileSync('latest.json', JSON.stringify(j, null, 2));
          "
          gh release upload "$TAG" latest.json --clobber --repo "${{ github.repository }}"

