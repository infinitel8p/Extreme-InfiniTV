name: Beta

# Triggers:
#  - push to any `release/**` branch  -> builds and publishes a beta prerelease
#  - run "Beta" from the Actions tab  -> same build, from whichever branch it's run on
#
# Versioning: X.Y.Z-beta.<ordinal>, where X.Y.Z is the stable core version read
# from package.json (any existing "-..." suffix is stripped first) and <ordinal>
# counts this base version's beta tags. The same ordinal forms the Android
# versionCode's last two digits, so release name and Play upload stay in sync.
# The tag is pushed eagerly, before any build, so failed runs still advance the
# count. (1.8.0 only: names keep the legacy GITHUB_RUN_NUMBER suffix, see meta.)
#
# Outputs (attached to a GitHub prerelease, published once desktop assets land):
#  Windows      *-setup.exe + .sig (NSIS only - WiX/MSI rejects prerelease
#               version strings), latest.json (auto-generated by tauri-action)
#  Linux        *.AppImage + .sig
#  macOS        *.dmg (universal, unsigned) - install manually from GitHub;
#               Gatekeeper needs right-click-Open or `xattr -d com.apple.quarantine`
#               on first launch
#  Android      *.apk (universal, signed); also builds a signed AAB and
#               publishes it to the Play open testing track when
#               PLAY_SERVICE_ACCOUNT_JSON is set (see release.yml)
#
# Uses the same repo secrets as release.yml (see that file for the list).

on:
  push:
    branches:
      - "release/**"
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-beta-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      version_code: ${{ steps.meta.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./package.json').version.split('-')[0]")

          # Beta ordinal = count of this base version's beta tags + 1. The eager tag
          # push below records it, so a run that fails after the Play upload still
          # advances the count and the versionCode can never be reused.
          # ls-remote emits an extra `^{}` peeled line per annotated tag - exclude those.
          EXISTING=$(git ls-remote --tags origin "refs/tags/v${BASE}-beta.*" | grep -v '\^{}' | wc -l || true)
          ORDINAL=$(( EXISTING + 1 ))
          if [ "$ORDINAL" -gt 89 ]; then
            ORDINAL=89
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          VERSION_CODE=$(( (10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH) * 100 + ORDINAL ))

          # Legacy guard: 1.8.0 shipped run-number-named betas (v1.8.0-beta.94), and the
          # beta update channel ranks prerelease suffixes numerically, so renaming that
          # version to low ordinals would never reach its users. Drop this branch (keep
          # the ordinal one) after 1.8.0.
          if [ "$BASE" = "1.8.0" ]; then
            VERSION="${BASE}-beta.${GITHUB_RUN_NUMBER}"
          else
            VERSION="${BASE}-beta.${ORDINAL}"
          fi
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          PREV=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          echo "prev_tag=$PREV" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN releases don't trigger other workflows, and this tag never matches release.yml's stable tag filter, so there's no recursion.
      - id: create
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          PREV_TAG: ${{ steps.meta.outputs.prev_tag }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          COMMIT_FORMAT="- %s ([\`%h\`](${REPO_URL}/commit/%H))"
          {
            echo "Automated beta build from [\`${BRANCH_NAME}\`](${REPO_URL}/tree/${BRANCH_NAME}) @ [\`${SHORT_SHA}\`](${REPO_URL}/commit/${GITHUB_SHA})."
            echo
            echo "Android versionCode: \`${VERSION_CODE}\`"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "### Commits since [\`${PREV_TAG}\`](${REPO_URL}/releases/tag/${PREV_TAG})"
              echo
              git log --no-merges --pretty=format:"$COMMIT_FORMAT" "${PREV_TAG}..HEAD"
            else
              echo "### Commits"
              echo
              git log --no-merges --pretty=format:"$COMMIT_FORMAT"
            fi
          } > "$RUNNER_TEMP/body.md"
          BODY=$(cat "$RUNNER_TEMP/body.md")
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Extreme InfiniTV $TAG (beta)" \
            -f body="$BODY" \
            -F draft=true \
            -F prerelease=true \
            --jq .id)
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      # Tag eagerly, before any build can upload to Play: a run that fails after the
      # Play upload must still leave a tag, or the versionCode ordinal below reuses a
      # code Play has already consumed. Publishing the draft later reuses this tag.
      - name: Push beta tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists (re-run); leaving it in place."
          else
            gh api repos/${{ github.repository }}/git/refs -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi

  build-desktop:
    needs: create-beta-release
    permissions:
      contents: write
      # Lets the sidecar fetch step read the "ffmpeg Sidecar" run status while polling.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis"
            rust-targets: ""
            sidecar-asset: ffmpeg-x86_64-pc-windows-msvc.exe
          - os: ubuntu-22.04
            args: "--bundles appimage"
            rust-targets: ""
            sidecar-asset: ffmpeg-x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            args: "--bundles appimage,deb"
            rust-targets: ""
            sidecar-asset: ffmpeg-aarch64-unknown-linux-gnu
          - os: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
            rust-targets: "aarch64-apple-darwin x86_64-apple-darwin"
            sidecar-asset: ffmpeg-universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-gl

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.os }}
          # Restore from main's cache only; betas don't seed their own cache.
          save-if: false

      - run: pnpm install --frozen-lockfile

      # ffmpeg sidecar binaries come from the "ffmpeg Sidecar" workflow's
      # rolling ffmpeg-sidecar-v2 prerelease, not built here.
      # The fetch retries so a same-push sidecar rebuild can finish publishing.
      # Integrity comes from the committed pins, not the release's own sums.
      - name: Fetch ffmpeg sidecar
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          ASSET="${{ matrix.sidecar-asset }}"
          sidecar_run_for_commit() {
            gh run list \
              --repo "${{ github.repository }}" \
              --workflow ffmpeg-sidecar.yml \
              --limit 10 \
              --json headSha,status,conclusion,url \
              --jq "[.[] | select(.headSha == \"$GITHUB_SHA\")][0] // empty | [.status, (.conclusion // \"\"), .url] | @tsv" \
              2>/dev/null || true
          }
          DOWNLOADED=0
          for attempt in $(seq 1 15); do
            if gh release download ffmpeg-sidecar-v2 \
              --repo "${{ github.repository }}" \
              --pattern "$ASSET" \
              --dir src-tauri/binaries \
              --clobber; then
              DOWNLOADED=1
              break
            fi
            RUN_LINE="$(sidecar_run_for_commit)"
            if [ -n "$RUN_LINE" ]; then
              RUN_STATUS="$(printf '%s' "$RUN_LINE" | cut -f1)"
              RUN_CONCLUSION="$(printf '%s' "$RUN_LINE" | cut -f2)"
              RUN_URL="$(printf '%s' "$RUN_LINE" | cut -f3)"
              if [ "$RUN_STATUS" = "completed" ] && [ "$RUN_CONCLUSION" != "success" ]; then
                echo "::error::The 'ffmpeg Sidecar' workflow run for this commit finished as '$RUN_CONCLUSION' ($RUN_URL), so $ASSET will never appear. Fix and re-run 'ffmpeg Sidecar', then re-run this beta build."
                exit 1
              fi
              echo "'ffmpeg Sidecar' run for this commit is '$RUN_STATUS' ($RUN_URL)"
            elif [ "$attempt" -eq 1 ]; then
              echo "No 'ffmpeg Sidecar' run found for $GITHUB_SHA, so the assets are expected to already exist on the ffmpeg-sidecar-v2 release."
            fi
            if [ "$attempt" -lt 15 ]; then
              echo "$ASSET not available yet (attempt $attempt/15), retrying in 60s..."
              sleep 60
            fi
          done
          if [ "$DOWNLOADED" -ne 1 ]; then
            echo "::error::Gave up waiting for $ASSET on the ffmpeg-sidecar-v2 release after 15 attempts (~15 min). The 'ffmpeg Sidecar' workflow publishes it: check that its latest run succeeded, then re-run this beta build once the assets are published."
            exit 1
          fi
          if ! EXPECTED_SHA=$(node src/scripts/ensure-ffmpeg-sidecar.mjs --print-pin "$ASSET"); then
            echo "::error::$ASSET has no pinned sha256 in src/scripts/ffmpeg-sidecar-checksums.json. Run 'node src/scripts/ensure-ffmpeg-sidecar.mjs --update-pins' and commit the result."
            exit 1
          fi
          cd src-tauri/binaries
          echo "$EXPECTED_SHA  $ASSET" > asset.sha256
          # macOS runners have shasum, not sha256sum; both read the same "hash  file" format.
          if command -v sha256sum >/dev/null 2>&1; then
            CHECKSUM_CMD=(sha256sum -c asset.sha256)
          else
            CHECKSUM_CMD=(shasum -a 256 -c asset.sha256)
          fi
          if ! "${CHECKSUM_CMD[@]}"; then
            echo "::error::$ASSET does not match its pinned sha256 in src/scripts/ffmpeg-sidecar-checksums.json. Either the sidecar was republished (refresh the pins with --update-pins) or the asset was tampered with."
            exit 1
          fi
          rm -f asset.sha256
          cd - >/dev/null
          # Rename after verification: checksum pins are keyed by the release asset name.
          DEST="infinitv-$ASSET"
          mv "src-tauri/binaries/$ASSET" "src-tauri/binaries/$DEST"
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            chmod +x "src-tauri/binaries/$DEST"
          fi

      - run: pnpm sync-version ${{ needs.create-beta-release.outputs.version }}

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-beta-release.outputs.release_id }}
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true

  build-android:
    needs: create-beta-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_PLAY_SECRET: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;29.0.13846066"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"
          key: android
          save-if: false

      - run: pnpm install --frozen-lockfile

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty"
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "XTREAM_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - run: pnpm sync-version ${{ needs.create-beta-release.outputs.version }}

      # The ordinal (and thus the versionCode) is computed once in create-beta-release
      # and recorded by its eager tag push; reusing the output keeps them in lockstep.
      - name: Set beta versionCode
        shell: bash
        run: echo "XTREAM_VERSION_CODE_OVERRIDE=${{ needs.create-beta-release.outputs.version_code }}" >> "$GITHUB_ENV"

      - name: Build signed APK (universal)
        env:
          XTREAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          XTREAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          XTREAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066
          XT_SKIP_FFMPEG_SIDECAR: "1"
        run: pnpm tauri android build --apk

      - name: Collect APK
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/android-out"
          mkdir -p "$OUT"
          VERSION="${{ needs.create-beta-release.outputs.version }}"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" -printf '%T@\t%p\n' | sort -rn | head -1 | cut -f2-)
          if [ -z "$APK" ]; then
            echo "::error::Could not locate signed APK after build"
            find src-tauri/gen/android/app/build/outputs -type f
            exit 1
          fi
          cp "$APK" "$OUT/Extreme InfiniTV_${VERSION}.apk"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Build signed AAB (mobile)
        if: env.HAS_PLAY_SECRET == 'true'
        env:
          XTREAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          XTREAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          XTREAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066
          XT_SKIP_FFMPEG_SIDECAR: "1"
        run: pnpm tauri android build --aab

      - name: Locate signed AAB
        id: locate-aab
        if: env.HAS_PLAY_SECRET == 'true'
        shell: bash
        run: |
          set -euo pipefail
          AAB=$(find src-tauri/gen/android/app/build/outputs/bundle -name "*release*.aab" -printf '%T@\t%p\n' | sort -rn | head -1 | cut -f2-)
          if [ -z "$AAB" ]; then
            echo "::error::Could not locate signed AAB after build"
            find src-tauri/gen/android/app/build/outputs -type f
            exit 1
          fi
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"

      - name: Publish beta AAB to Play open testing track
        if: env.HAS_PLAY_SECRET == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.infinitel8p.xtream
          releaseFiles: ${{ steps.locate-aab.outputs.aab }}
          track: beta
          status: completed

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(gh release view ${{ needs.create-beta-release.outputs.release_id }} --json tagName -q .tagName 2>/dev/null \
            || gh api repos/${{ github.repository }}/releases/${{ needs.create-beta-release.outputs.release_id }} --jq .tag_name)
          gh release upload "$TAG" \
            "${{ steps.collect.outputs.out }}/"*.apk \
            --clobber

  # Publishing only after desktop builds guarantees latest.json exists before beta clients can see the new tag; the APK may attach a few minutes later, which is fine.
  publish-beta:
    needs: [create-beta-release, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Patch latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-beta-release.outputs.version }}
        run: |
          set -euo pipefail
          TAG=$(gh release view ${{ needs.create-beta-release.outputs.release_id }} --json tagName -q .tagName 2>/dev/null \
            || gh api repos/${{ github.repository }}/releases/${{ needs.create-beta-release.outputs.release_id }} --jq .tag_name)
          mkdir -p _updater
          cd _updater
          if ! gh release download "$TAG" -p latest.json --repo "${{ github.repository }}"; then
            echo "::warning::latest.json missing on release $TAG - skipping notes patch"
            exit 0
          fi
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          NOTES="Beta v${VERSION} - built from ${BRANCH_NAME}"
          NOTES="$NOTES" TAG="$TAG" node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
            j.notes = process.env.NOTES;
            // Prereleases never resolve as releases/latest, so point each platform at its own tag.
            for (const platformKey of Object.keys(j.platforms)) {
              const platform = j.platforms[platformKey];
              platform.url = platform.url.replace('releases/latest/download/', \`releases/download/\${process.env.TAG}/\`);
            }
            fs.writeFileSync('latest.json', JSON.stringify(j, null, 2));
          "
          gh release upload "$TAG" latest.json --clobber --repo "${{ github.repository }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X PATCH repos/${{ github.repository }}/releases/${{ needs.create-beta-release.outputs.release_id }} -F draft=false
