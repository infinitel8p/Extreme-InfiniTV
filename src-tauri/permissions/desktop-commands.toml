# App-level command ACL for the desktop build's own custom commands.
# Creating this file gives the app an ACL manifest, which makes every custom
# command require an explicit grant (see ipc/authority.rs in the tauri crate) -
# so every existing desktop-only command must be listed here, not just the
# sniffer's, or it stops working from the main window.

[[permission]]
identifier = "allow-desktop-commands"
description = "Local-origin access to Extreme InfiniTV's desktop-only commands."
commands.allow = [
    "discord_set_activity",
    "discord_clear",
    "discord_disconnect",
    "launch_external_player",
    "install_appx_package",
    "is_store_build",
    "set_close_to_tray",
    "updater_check_from",
    "updater_install",
    "sniff_page",
    "cancel_sniff",
    "register_vod_proxy",
    "unregister_vod_proxy",
]
